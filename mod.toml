# nearby_warp_skip: skip the Forsaken nearby-system warp hold.
# The 10s Initiating Warp hold is hardcoded in the exe: the star marker UI
# shows 10.0 minus elapsed as int, and the warp-update gate engages the warp
# once elapsed reaches 10.0. Two fail-loud patches, always applied: the UI
# count is forced to zero and the wait branch is NOPed. The Warp Destination
# tunnel itself is EXML data shipped in this same folder
# (GLOBALS/GCSPACESHIPGLOBALS EXML, MiniWarp tunnel shortened to instant).
[mod]
id = "eu.savagecore.nearby_warp_skip"
version = "0.1.0"
label = "Nearby Warp Countdown Skip"
description = "Skips the Forsaken nearby-system warp countdown."
enabled = true

[[mod.text]]
lang = "nl"
description = "Slaat het aftellen voor de nabije warp van Forsaken over."

[[mod.text]]
lang = "de"
description = "Überspringt den Countdown für den nahen Warp aus Forsaken."

[[mod.text]]
lang = "fr"
description = "Ignore le compte à rebours du warp proche de Forsaken."

