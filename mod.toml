[[patch]]
id = "instant-countdown-ui"
op = "write-bytes"
pattern = "F3 0F 5F C1 E8 ?? ?? ?? ?? F3 0F 2C C8 85 C9 89 4D 10"
offset = 9
expect = "F3 0F 2C C8"
bytes = "31 C9 66 90"

[[patch]]
id = "instant-warp-gate"
op = "write-bytes"
pattern = "F3 0F 10 83 0C 0D 00 00 0F 2F C2 0F 82 ?? ?? ?? ??"
offset = 11
expect = "0F 82 91 01 00 00"
bytes = "66 0F 1F 44 00 00"
